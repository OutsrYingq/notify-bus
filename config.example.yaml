# notify-bus seed config.
#
# The defaults below are quiet, and they apply only when you create a config from
# this example. An existing config.yaml is NOT migrated automatically: it keeps
# whatever it had — including a shared route whose action exclusions hit Issue and
# pull_request alike, which is worth re-reading by hand against the notes under
# `routes`. Every filter here is route-local, not a global ban: a later route may
# still send what an earlier one dropped.
#
# Copy to config.yaml (gitignored) and edit. This YAML is the only config source
# today: routes, channels and templates are read from it at startup, so an edit
# needs a restart. The SQLite store, the admin UI that will edit it, and the
# "DB wins on conflict" merge are M3 and not implemented yet. See
# src/lib/config/index.ts.
#
# All fields are optional: no config.yaml at all is valid — nothing matches
# until you add a route.
#
# NOTE on templates: the Feishu adapter builds a rich card per event type
# (header color, buttons, stat tiles) in code, and the card already renders the
# payload's own title and body. A template here only *adds* body markdown on
# top of that — so it should carry something the card does not already show.
# Omit a template entirely and no extra body is sent. See
# packages/server/src/lib/adapters/feishu-cards.ts.

channels:
  - name: team-feishu
    type: feishu
    webhook_url: https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_ME
    secret: "" # optional: feishu signing secret, if enabled on the bot
    # Who this channel is allowed to @. The key is a GitHub login (matched
    # case-insensitively), the value the person's Feishu `user_id` — the id type
    # that was verified against a real group: a schema 2.0 card with
    # `<at id=<user_id>>` renders as a mention and reaches the client.
    #
    # A real @ needs all four of these, and until they all hold nothing is sent:
    #   1. GitHub is sending that event (subscribe it on the repository);
    #   2. a route here names it and its conditions hold;
    #   3. this map holds the login that was named;
    #   4. the event itself names that login — a comment's plain text, or a
    #      review request's reviewer.
    # A login that is not in this map is never mentioned, and login text found in
    # a payload is never rendered as a mention on its own. Deleting a line is how
    # you stop mentioning somebody; the map is per channel.
    #
    # The value has to be a person: `all` (and `here`) address the whole chat in
    # Feishu, so they are rejected here rather than quietly pinging a group.
    # mention_map:
    #   octocat: "REPLACE_WITH_FEISHU_USER_ID"
    enabled: true

routes:
  # Three routes, one policy each, over mutually exclusive event types — so the
  # order they run in (all priority 100) never decides anything. Every event
  # GitHub sends that no route names is dropped until you add one — a config
  # edit, nothing more. Events that have a dedicated card render richly, the
  # rest become the plain grey fallback card (see
  # packages/server/src/lib/adapters/).
  #
  # `match_payload` is the route-local payload condition, for what `match_action`
  # cannot express — a branch, a CI conclusion, a deployment state. It is a list
  # of clauses OR'd together, each clause a map of dotted payload paths AND'd
  # together; a single clause may be written without the list wrapper. An
  # expected value is compared as text, so `true` matches a `true` payload field;
  # `*` matches any run of characters, newlines included; and `$default_branch`
  # stands for `payload.repository.default_branch`. A field the payload does not
  # carry never matches — a missing `deleted` is not a `false` one. A malformed
  # condition (a scalar, `null`, an empty clause, an empty list) is rejected when
  # the config loads, naming the route, rather than read as "matches everything".
  #
  # Some events are different observation points on the same activity — pick by
  # how your tooling reports, expecting one notification per source you add:
  #   - CI: `workflow_run` for GitHub Actions; `status` for an external CI on
  #     the Statuses API; `check_run` / `check_suite` for one on the Checks API.
  #   - Deployment: `deployment_status` is a deployment's progress and result;
  #     `deployment` is a different event, the moment one is created. Neither
  #     replaces the other — keep both if you want that moment too.
  #
  # Both result events are opt-in and off by default: the commented examples
  # further down show the "only if it failed" shape for each.
  #
  # Three pairs of names look interchangeable. Nothing here established that one
  # action fires both, or that subscribing to both sends two notifications, so
  # send yourself a test event of each half before relying on either:
  #   - `star` / `watch` — `star` has its own card, `watch` is the grey fallback
  #   - `repository` action `publicized` / `public`
  #   - `team` action `added_to_repository` / `team_add`

  # The pushes worth waking a channel for: a newly created branch (its first
  # push, and only that one) and updates to the repository's default branch,
  # force pushes included. A tag is not a branch — `refs/tags/...` matches
  # neither clause even when GitHub sets `created: true` on it. Appending
  # commits to a feature branch is silent, and so is force pushing one: a forced
  # push is only noteworthy where it matched anyway, so no clause keys off
  # `forced`. No deletion notifies either — clause one needs `created`, and
  # clause two asks for `deleted: false`, which keeps a default-branch removal
  # out. A payload carrying no `repository.default_branch` cannot satisfy clause
  # two — that update is refused rather than matched against a guessed `main` —
  # while clause one never reads the field, so a new branch is still delivered
  # either way. A repo whose default branch is `develop` gets that branch here,
  # and `main` on it stays silent.
  #
  # For further important branches, add a clause of your own rather than a
  # second route, for example:
  #     - ref: refs/heads/release/*
  - name: pushes-to-team
    match_repo: "*" # `*` matches every repository
    match_event: push
    match_payload:
      - ref: refs/heads/*
        created: true
      - ref: refs/heads/$default_branch
        deleted: false
    target_channel: team-feishu # resolved by name to a channel above
    priority: 100 # lower = higher priority; first match wins
    enabled: true

  # Issue activity that concerns someone: opened, closed, reopened, assigned.
  # The whitelist is the whole policy — `labeled`, `unlabeled`, `edited`,
  # `pinned`, `locked`, `milestoned` and the rest of the churn are not listed,
  # so they are not delivered (they resolve as `no_route`, the same as an event
  # no route names). Deliberately silent as well: `unassigned`, because a second
  # assignment change says little, and `transferred`, because the issue now
  # belongs to another repository. Add either to the list to hear about it.
  #
  # Keep `pull_request` off this route. `assigned` and `unassigned` exist on both
  # events, so an exclusion written here would also silence an assignment on a
  # PR — and a whitelist like this one would drop every PR action it does not
  # name. The route below carries them instead.
  - name: issues-to-team
    match_repo: "*"
    match_event: issues
    match_action: opened,closed,reopened,assigned
    target_channel: team-feishu
    priority: 100
    enabled: true

  # Pull requests and releases keep their previous behavior: every action, no
  # payload condition. `pull_request.review_requested` (a review was asked for)
  # is a different event from `pull_request_review` (a review was submitted):
  # the first arrives here, the second only if you name it in a route.
  #
  # A review request now names the reviewer in the card, and @s them when this
  # channel's `mention_map` holds them; one it does not hold is named in plain
  # text instead. A requested team stays a team name — its members are not in the
  # payload and are never guessed at, and `@all` is not used.
  #
  # Overlap with the push route is expected: merging a pull request also pushes
  # to its base branch, and pushing to a pull request's branch re-sends
  # `pull_request` (`synchronize`) alongside `push`. Add `synchronize` to
  # `exclude_action` below to drop that one — except for a fork pull request,
  # whose push lands in the fork, which can leave `synchronize` as the only
  # delivery. All of this comes from GitHub's event semantics rather than a run
  # measured here, so confirm it on your own repositories before silencing.
  - name: pull-request-release-to-team
    match_repo: "*"
    match_event: pull_request,release
    target_channel: team-feishu
    priority: 100
    enabled: true

  # Example: match every event except known noise. Omit `match_event` to match
  # all event types — unlike match_repo, event lists intentionally do not use `*`.
  # The result events are in this list as well: they are opt-in, and a single run
  # reports itself several times, so an unlisted `workflow_run` would deliver the
  # whole run — not just its failures. Enabling this example does not take them
  # away from a failures-only route of your own, further down: an exclusion is
  # route-local, and a later route still receives what this one drops.
  # - name: all-except-noise
  #   match_repo: "*"
  #   exclude_event: create,delete,label,milestone,status,check_run,check_suite,workflow_job,workflow_run,deployment_status,project,project_card,project_column,page_build,meta,security_and_analysis
  #   target_channel: team-feishu
  #   priority: 200

  # Example: a whole-comment route of your own. Routes without `match_payload`
  # keep matching every action in their event domain, which is how a route like
  # this one still delivers all conversation comments.
  # - name: pr-conversation
  #   match_repo: "*"
  #   match_event: issue_comment
  #   target_channel: team-feishu
  #   priority: 50

  # Example: only the comments that address somebody this channel maps.
  # `issue_comment` stays opt-in, and `mention_only` narrows it further: the
  # comment has to name a mapped login in its plain text — fenced and inline code
  # excluded, e-mail addresses, `@all`, `@org/team`, `@alice_smith` and a mention
  # written inside a URL never counted — and its author has to be mapped too, so
  # a stranger on a public repository cannot @ a teammate through notify-bus. At
  # most 5 people are mentioned, once each per person — two logins mapped to one
  # Feishu id are one person — in the order the comment named them, all in the
  # one card. A comment that names nobody mapped is refused (`mention_only`), not
  # delivered to the whole group.
  #
  # Only a comment's first posting is read: editing a comment to add an @ does
  # not notify, and a deleted comment notifies nobody. `match_action: created`
  # says that in the config, and the route enforces it either way.
  # - name: mention-only-comments
  #   match_repo: "*"
  #   match_event: issue_comment
  #   match_action: created
  #   mention_only: true
  #   target_channel: team-feishu
  #   priority: 50

  # The same policy covers a pull request's line-by-line review comments — the
  # ones on the Files changed tab — which keep the plain card they have today:
  # - name: mention-only-review-comments
  #   match_repo: "*"
  #   match_event: pull_request_review_comment
  #   match_action: created
  #   mention_only: true
  #   target_channel: team-feishu
  #   priority: 50

  # Example: only a failing CI run. `workflow_run` is opt-in twice over — GitHub
  # has to be sending the event (subscribe it on the repository) and a route has
  # to name it. "Only a failure" is a payload condition, not a colour: the card's
  # red is a display choice, so `timed_out` and `startup_failure` — which render
  # red too — are not delivered unless you list them here. A run still in
  # progress carries no conclusion, and a missing field never matches, so it
  # stays silent on its own.
  # - name: ci-failures
  #   match_repo: "*"
  #   match_event: workflow_run
  #   match_payload:
  #     - action: completed
  #       workflow_run.conclusion: failure
  #   target_channel: team-feishu
  #   priority: 50

  # Example: only a failed deployment. `deployment_status` is a deployment's
  # progress and result, and only a deployment that reports its status produces
  # the event. Its `action` is always `created` — the state is the signal:
  # `failure` and `error` say something went wrong, `pending` / `queued` /
  # `in_progress` say it is running, `success` says it finished. This route takes
  # the two failures. (`deployment`, a different event, is the moment one is
  # created.)
  # - name: deployment-failures
  #   match_repo: "*"
  #   match_event: deployment_status
  #   match_payload:
  #     - deployment_status.state: failure
  #     - deployment_status.state: error
  #   target_channel: team-feishu
  #   priority: 50

# Templates below are OPTIONAL. A template adds body markdown to that event
# type's card; the card structure (colors, buttons, commits) and the payload's
# own title and body are built in code regardless. Omit a template when you have
# nothing to add — no extra body is sent.
templates:
  # (optional — remove this whole block if you have nothing to add)
  #
  # Built-in cards already render `pull_request.body`, `issue.body`,
  # `release.body` and the pushed commit list, so a template that re-renders one
  # of those fields makes it appear TWICE in the card. Add content the card does
  # not already show instead (#16).
  #
  # Example: the PR card shows the title, a truncated body, and who was asked to
  # review, but not its milestone or assignees, so this adds only that line.
  # - event_type: pull_request
  #   template: |
  #     {{#if payload.pull_request.milestone}}🎯 Milestone: {{payload.pull_request.milestone.title}}{{/if}}
