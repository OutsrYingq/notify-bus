# notify-bus seed config.
#
# Quiet defaults apply only when creating a config from this updated example.
# Existing config.yaml files are NOT migrated automatically: add match_event
# or exclude_event manually, and check later routes for fallback delivery.
# Exclusions are route-local, not a global ban; a later route may still send.
#
# Copy to config.yaml (gitignored) and edit. The admin UI / SQLite store is
# the live source of truth; this YAML is seed/bootstrap only — the DB wins
# on conflict. See src/lib/config/index.ts.
#
# All fields are optional. Running DB-only (no config.yaml) is valid.
#
# NOTE on templates: the Feishu adapter builds a rich card per event type
# (header color, buttons, stat tiles) in code, and the card already renders the
# payload's own title and body. A template here only *adds* body markdown on
# top of that — so it should carry something the card does not already show.
# Omit a template entirely and no extra body is sent. See
# packages/server/src/lib/adapters/feishu-cards.ts.

channels:
  - name: team-feishu
    type: feishu
    webhook_url: https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_ME
    secret: "" # optional: feishu signing secret, if enabled on the bot
    enabled: true

routes:
  # Choosing events. Only the four types in `match_event` below are delivered;
  # every other event GitHub sends is dropped until you name it in a route — a
  # config edit, nothing more. Events that have a dedicated card render richly,
  # the rest become the plain grey fallback card (see
  # packages/server/src/lib/adapters/).
  #
  # Some events are different observation points on the same activity — pick by
  # how your tooling reports, expecting one notification per source you add:
  #   - CI: `workflow_run` for GitHub Actions; `status` for an external CI on
  #     the Statuses API; `check_run` / `check_suite` for one on the Checks API.
  #   - Deployment: `deployment_status` is a deployment's progress and result;
  #     `deployment` is a different event, the moment one is created. Neither
  #     replaces the other — keep both if you want that moment too.
  #
  # Three pairs of names look interchangeable. Nothing here established that one
  # action fires both, or that subscribing to both sends two notifications, so
  # send yourself a test event of each half before relying on either:
  #   - `star` / `watch` — `star` has its own card, `watch` is the grey fallback
  #   - `repository` action `publicized` / `public`
  #   - `team` action `added_to_repository` / `team_add`
  #
  # Overlap between different actions is expected too: merging a pull request
  # also pushes to the base branch, so `pull_request` and `push` may both
  # arrive; pushing to a pull request's branch also re-sends `pull_request`
  # (`synchronize`) alongside `push`. Adding `synchronize` to `exclude_action`
  # below drops that one — except for a fork pull request, whose push lands in
  # the fork and can leave `synchronize` as the only delivery. All of this comes
  # from GitHub's event semantics rather than a run measured here, so confirm it
  # on your own repositories before silencing anything.
  - name: core-events-to-team
    match_repo: "*" # `*` matches every repository
    match_event: push,pull_request,issues,release
    # match_action: opened,closed # omit to match all actions
    # exclude_event and exclude_action apply only to this route. An excluded
    # event/action may still be delivered by a later, lower-priority route.
    # exclude_action: labeled,unlabeled,assigned,synchronize
    target_channel: team-feishu # resolved by name to a channel above
    priority: 100 # lower = higher priority; first match wins
    enabled: true

  # Example: match every event except known noise. Omit `match_event` to match
  # all event types — unlike match_repo, event lists intentionally do not use `*`.
  # - name: all-except-noise
  #   match_repo: "*"
  #   exclude_event: create,delete,label,milestone,status,check_run,check_suite,workflow_job,project,project_card,project_column,page_build,meta,security_and_analysis
  #   target_channel: team-feishu
  #   priority: 200

  # Example: get issues but silence label/assignment churn on this route.
  # - name: issues-without-label-churn
  #   match_repo: "*"
  #   match_event: issues
  #   exclude_action: labeled,unlabeled,assigned
  #   target_channel: team-feishu
  #   priority: 50

# Templates below are OPTIONAL. A template adds body markdown to that event
# type's card; the card structure (colors, buttons, commits) and the payload's
# own title and body are built in code regardless. Omit a template when you have
# nothing to add — no extra body is sent.
templates:
  # (optional — remove this whole block if you have nothing to add)
  #
  # Built-in cards already render `pull_request.body`, `issue.body`,
  # `release.body` and the pushed commit list, so a template that re-renders one
  # of those fields makes it appear TWICE in the card. Add content the card does
  # not already show instead (#16).
  #
  # Example: the PR card shows the title and a truncated body, but not who has
  # been asked to review, so this adds only that line.
  # - event_type: pull_request
  #   template: |
  #     {{#if payload.pull_request.requested_reviewers}}👥 Review requested: {{#each payload.pull_request.requested_reviewers}}{{login}} {{/each}}{{/if}}
